<!DOCTYPE html>

<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>

    <title>Pardonpedia</title>
    <meta name="description" content="Encyclopedia of presidential pardons and clemency">

    <link rel='icon' type='image/x-icon' href='data:;base64,iVBORw0KGgo='>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src='https://unpkg.com/crossfilter2@1.4.8/crossfilter.js'></script>
    <script src='https://d3js.org/d3.v7.min.js'></script>
    <script src='https://unpkg.com/dc@4.2.7/dist/dc.js'></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'></script>

    <script type="module" src='js/site.js'></script>

    <link href='https://cdn.jsdelivr.net/npm/dc@4.2.7/dist/style/dc.min.css' rel='stylesheet' type='text/css'>

    <link href='css/layout.css' rel='stylesheet' type='text/css'>
    <link href='css/style.css' rel='stylesheet' type='text/css'>
</head>

<body>
    <div id="page-transition" class="page-transition"></div>
    <div id="loading-overlay" class="loading-hidden">
        <div class="spinner"></div>
    </div>

    <div id='app-container'>
        <!-- Header Row -->
        <header id='app-header'>
            <div id='title'>
                <div class='title-main'>
                    <h1>Pardonpedia</h1>
                </div>
                <nav id='nav-links'>
                    <a href='index.html' class='active'>Pardons</a>
                    <a href='about.html'>About</a>
                </nav>
            </div>
            <div id='updated-date'></div>
        </header>

        <!-- Main Content: Filter Zone + Results Zone -->
        <main id='main-content'>

            <!-- Full-width time chart row -->
            <div id='time-chart-row'>
                <div class='chart-title'>Pardons per Year</div>
                <div id='chart-grant-date'></div>
            </div>

            <!-- Filter Zone (2 columns) -->
            <div id='filter-zone'>
                <!-- Column 1: Presidency + Clemency stacked -->
                <div id='filter-col-left'>
                    <div id='filter-col-president' class='filter-column'>
                        <div id='chart-president_term'></div>
                    </div>
                    <div id='filter-col-clemency' class='filter-column'>
                        <div id='chart-clemency_type'></div>
                    </div>
                </div>

                <!-- Column 2: District -->
                <div id='filter-col-district' class='filter-column'>
                    <div id='chart-district'></div>
                </div>
            </div>

            <!-- Results Zone -->
            <div id='results-zone'>
                <div id='results-header'>
                    <div id='results-header-top'>
                        <div id='name-search-group'>
                            <div id='name-search-wrap'>
                                <input id='name-search-input' type='text' placeholder='Search pardon recipients' autocomplete='off' spellcheck='false'>
                                <button id='name-search-icon' type='button' tabindex='-1'>
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                </button>
                                <div id='name-search-dropdown'></div>
                            </div>
                            <div id='menu-info'></div>
                        </div>
                        <button id='download-csv' class='download-button' title='Download filtered records as CSV'>CSV <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M12 15l-5-5M12 15l5-5M5 21h14"/></svg></button>
                    </div>
                    <div id='filters'></div>
                </div>
                <div id='chart-list'></div>
            </div>
        </main>
    </div>
    <script>
        const transition = document.getElementById('page-transition');
        transition.classList.add('fade-in');

        document.querySelectorAll('#nav-links a:not(.active)').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const href = link.href;
                transition.classList.remove('fade-in');
                transition.classList.add('fade-out');
                setTimeout(() => { window.location.href = href; }, 150);
            });
        });
    </script>
</body>
</html>
