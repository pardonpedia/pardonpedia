<!DOCTYPE html>

<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>

    <title>About — Pardonpedia</title>
    <meta name="description" content="About Pardonpedia — an encyclopedia of presidential pardons and clemency">

    <link rel='icon' type='image/x-icon' href='data:;base64,iVBORw0KGgo='>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link href='css/layout.css' rel='stylesheet' type='text/css'>
    <link href='css/style.css' rel='stylesheet' type='text/css'>
    <link href='css/about.css' rel='stylesheet' type='text/css'>
</head>

<body>
    <div id="page-transition" class="page-transition"></div>

    <div id='app-container'>
        <header id='app-header'>
            <div id='title'>
                <div class='title-main'>
                    <h1><a href='index.html'>Pardonpedia</a></h1>
                </div>
                <nav id='nav-links'>
                    <a href='index.html'>Pardons</a>
                    <a href='about.html' class='active'>About</a>
                </nav>
            </div>
        </header>

        <main id='about-main'>
            <div class='about-content' id='about-content'>
                <p class='about-loading'>Loading&hellip;</p>
            </div>
        </main>
    </div>

    <script>
        const transition = document.getElementById('page-transition');
        transition.classList.add('fade-in');

        document.querySelectorAll('#nav-links a:not(.active)').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const href = link.href;
                transition.classList.remove('fade-in');
                transition.classList.add('fade-out');
                setTimeout(() => { window.location.href = href; }, 150);
            });
        });

        const renderer = new marked.Renderer();
        renderer.link = ({ href, title, text }) => {
            const titleAttr = title ? ` title="${title}"` : '';
            return `<a href="${href}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
        };

        fetch('about.md')
            .then(r => r.text())
            .then(text => {
                document.getElementById('about-content').innerHTML = marked.parse(text, { renderer });
            });
    </script>
</body>
</html>
