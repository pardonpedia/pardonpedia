<!DOCTYPE html>

<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>

    <title>Data Dictionary — Pardonpedia</title>
    <meta name="description" content="Data Dictionary — field definitions and value explanations for the Pardonpedia dataset">
    <link rel="canonical" href="https://pardonpedia.org/pages/data-dictionary.html">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <link href='../css/layout.css' rel='stylesheet' type='text/css'>
    <link href='../css/style.css' rel='stylesheet' type='text/css'>
    <link href='../css/about.css' rel='stylesheet' type='text/css'>
</head>

<body>
    <div id="page-transition" class="page-transition"></div>

    <div id='app-container'>
        <header id='app-header'>
            <div id='title'>
                <div class='title-main'>
                    <h1><a href='../index.html'>Pardonpedia</a></h1>
                </div>
                <nav id='nav-links'>
                    <a href='../index.html'>Pardons</a>
                    <a href='../givebacks.html'>Givebacks</a>
                </nav>
            </div>
            <div class='header-side'>
                <div id='updated-date'></div>
                <div class='header-dropdown'>
                    <span class='header-dropdown-trigger' tabindex='0'>About</span>
                    <div class='header-dropdown-menu'>
                        <a href='pardon-data-sources.html'>Pardon Data Sources</a>
                        <a href='pardon-patterns.html'>Pardon Patterns</a>
                        <a href='data-dictionary.html' class='active'>Data Dictionary</a>
                        <a href='release-notes.html'>Release Notes</a>
                        <a href='about.html'>About</a>
                    </div>
                </div>
            </div>
        </header>

        <main id='about-main'>
            <div class='about-content' id='about-content'>
                <p class='about-loading'>Loading&hellip;</p>
            </div>
        </main>
    </div>

    <script>
        const transition = document.getElementById('page-transition');
        transition.classList.add('fade-in');

        document.querySelectorAll('#nav-links a:not(.active)').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const href = link.href;
                transition.classList.remove('fade-in');
                transition.classList.add('fade-out');
                setTimeout(() => { window.location.href = href; }, 150);
            });
        });

        const renderer = new marked.Renderer();
        renderer.link = ({ href, title, text }) => {
            const titleAttr = title ? ` title="${title}"` : '';
            return `<a href="${href}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
        };

        mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: { primaryColor: '#e8f0fe', primaryBorderColor: '#1a365d', lineColor: '#718096', textColor: '#1a202c' } });

        fetch('../content/data-dictionary.md')
            .then(r => r.text())
            .then(text => {
                const el = document.getElementById('about-content');
                el.innerHTML = marked.parse(text, { renderer });
                el.querySelectorAll('pre code.language-mermaid').forEach(code => {
                    const pre = code.parentElement;
                    const div = document.createElement('pre');
                    div.className = 'mermaid';
                    div.textContent = code.textContent;
                    pre.replaceWith(div);
                });
                mermaid.run();
            });
    </script>
</body>
</html>
