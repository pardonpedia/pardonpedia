<!DOCTYPE html>

<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>

    <title>Methodology — Pardonpedia</title>
    <meta name="description" content="Methodology — how Pardonpedia data is collected, sourced, and verified">
    <link rel="canonical" href="https://pardonpedia.org/pages/methodology.html">

    <link rel='icon' type='image/x-icon' href='data:;base64,iVBORw0KGgo='>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link href='../css/layout.css' rel='stylesheet' type='text/css'>
    <link href='../css/style.css' rel='stylesheet' type='text/css'>
    <link href='../css/about.css' rel='stylesheet' type='text/css'>
</head>

<body>
    <div id="page-transition" class="page-transition"></div>

    <div id='app-container'>
        <header id='app-header'>
            <div id='title'>
                <div class='title-main'>
                    <h1><a href='../index.html'>Pardonpedia</a></h1>
                </div>
                <nav id='nav-links'>
                    <a href='../index.html'>Pardons</a>
                    <a href='../givebacks.html'>Givebacks</a>
                </nav>
            </div>
            <div class='header-side'>
                <div id='updated-date'></div>
                <div class='header-dropdown'>
                    <span class='header-dropdown-trigger'>Data Sources</span>
                    <div class='header-dropdown-menu'>
                        <a href='methodology.html' class='active'>Methodology</a>
                        <a href='data-dictionary.html'>Data Dictionary</a>
                        <a href='release-notes.html'>Release Notes</a>
                        <a href='about.html'>About</a>
                    </div>
                </div>
            </div>
        </header>

        <main id='about-main'>
            <div class='about-content' id='about-content'>
                <p class='about-loading'>Loading&hellip;</p>
            </div>
        </main>
    </div>

    <script>
        const transition = document.getElementById('page-transition');
        transition.classList.add('fade-in');

        document.querySelectorAll('#nav-links a:not(.active)').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const href = link.href;
                transition.classList.remove('fade-in');
                transition.classList.add('fade-out');
                setTimeout(() => { window.location.href = href; }, 150);
            });
        });
    </script>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0.1/dist/mermaid-layout-elk.esm.min.mjs';
        mermaid.registerLayoutLoaders(elkLayouts);
        mermaid.initialize({
            startOnLoad: false,
            layout: 'elk',
            securityLevel: 'loose',
            theme: 'base',
            themeVariables: { primaryColor: '#e8f0fe', primaryBorderColor: '#1a365d', lineColor: '#718096', textColor: '#1a202c' }
        });

        const renderer = new marked.Renderer();
        renderer.link = ({ href, title, text }) => {
            const titleAttr = title ? ` title="${title}"` : '';
            return `<a href="${href}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
        };

        fetch('../content/methodology.md')
            .then(r => r.text())
            .then(text => {
                const el = document.getElementById('about-content');
                el.innerHTML = marked.parse(text, { renderer });
                el.querySelectorAll('pre code.language-mermaid').forEach(code => {
                    const pre = code.parentElement;
                    const div = document.createElement('pre');
                    div.className = 'mermaid';
                    div.textContent = code.textContent;
                    pre.replaceWith(div);
                });
                mermaid.run();
            });
    </script>
</body>
</html>
